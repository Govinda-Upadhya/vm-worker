[package]
name = "worker"
version = "0.1.0"
edition = "2024"

[dependencies]
sysinfo = "0.40"
os_info = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nix = { version = "0.29", features = ["fs"] }
reqwest = { version = "0.12", features = ["blocking", "json"] } # Synchronous HTTP client
